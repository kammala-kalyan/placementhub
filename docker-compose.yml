# PlacementHub stack. Start everything with:  docker compose up -d --build
# Only the web service (nginx) is reachable from outside; everything else
# talks over the private Docker network that Compose creates.
name: placementhub

# Rotate container logs so they can never fill the server's disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node        # one node, no cluster discovery
      - xpack.security.enabled=false      # OK only because ES is never exposed publicly
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"             # localhost only (debugging, Jenkins re-index)
    mem_limit: ${ES_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Cap memory and evict least-recently-used keys when full.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${IMAGE_PREFIX:-placementhub}-api:${IMAGE_TAG:-latest}
    environment:
      - ES_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-60}
      - PARSER=${PARSER:-rules}
      - S3_BUCKET=${S3_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
    ports:
      - "127.0.0.1:8000:8000"             # localhost only; the public goes through nginx
    depends_on:
      elasticsearch:
        condition: service_healthy        # wait until ES can accept requests
      redis:
        condition: service_started        # API works even if Redis is unhealthy
    mem_limit: 256m
    logging: *default-logging
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: ${IMAGE_PREFIX:-placementhub}-bot:${IMAGE_TAG:-latest}
    # Token, chat ids and topic ids come from .env (never committed).
    env_file:
      - path: .env
        required: false
    environment:
      - API_URL=http://api:8000
      - REDIS_URL=redis://redis:6379/1   # separate Redis DB for rate-limit counters
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    logging: *default-logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ${IMAGE_PREFIX:-placementhub}-web:${IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT:-80}:8080"            # the only public port
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    logging: *default-logging
    restart: unless-stopped

volumes:
  esdata:
  redisdata:
