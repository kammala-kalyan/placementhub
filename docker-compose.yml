# PlacementHub local stack. Start everything with:  docker compose up -d --build
# Services are added phase by phase (bot in Phase 3, web in Phase 4).
name: placementhub

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node        # one node, no cluster discovery
      - xpack.security.enabled=false      # OK only because ES is never exposed publicly
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"             # localhost only, for debugging with curl
    mem_limit: ${ES_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Cap memory and evict least-recently-used keys when full.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${IMAGE_PREFIX:-placementhub}-api:${IMAGE_TAG:-latest}
    environment:
      - ES_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-60}
      - PARSER=${PARSER:-rules}
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy        # wait until ES can accept requests
      redis:
        condition: service_started        # API works even if Redis is unhealthy
    mem_limit: 256m
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: ${IMAGE_PREFIX:-placementhub}-bot:${IMAGE_TAG:-latest}
    # Token, chat ids and topic ids come from .env (never committed).
    env_file:
      - path: .env
        required: false
    environment:
      - API_URL=http://api:8000
      - REDIS_URL=redis://redis:6379/1   # separate Redis DB for rate-limit counters
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

volumes:
  esdata:
  redisdata:
