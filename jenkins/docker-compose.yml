# Local Jenkins for the nightly pipeline.
#   cd jenkins
#   copy .env.example .env   (set JENKINS_ADMIN_PASSWORD)
#   docker compose up -d --build
#   open http://localhost:8081  (user: admin)
#
# Start the main stack first (docker compose up -d in the repo root): Jenkins
# joins its network to reach Elasticsearch at http://elasticsearch:9200.
name: placementhub-jenkins

services:
  jenkins:
    build: .
    ports:
      - "127.0.0.1:8081:8080"            # localhost only
    environment:
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in jenkins/.env}
      # Local copy of the repo by default; use your GitHub URL once pushed.
      - REPO_URL=${REPO_URL:-file:///repo}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/casc/casc.yaml:ro
      - ..:/repo:ro                       # this repository, read-only
    networks:
      - default
      - placementhub
    mem_limit: 1g
    restart: unless-stopped

volumes:
  jenkins_home:

networks:
  placementhub:
    name: placementhub_default            # created by the main docker-compose.yml
    external: true
