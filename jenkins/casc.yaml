# Jenkins Configuration as Code (JCasC): the whole Jenkins setup lives in Git.
# ${VARS} are filled from the container's environment (see docker-compose.yml).

jenkins:
  systemMessage: "PlacementHub nightly pipeline (configured as code)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8081/"

# Create the pipeline job automatically. Its steps live in jenkins/Jenkinsfile
# inside the repository ("pipeline as code").
jobs:
  - script: >
      pipelineJob('placementhub-nightly') {
        description('Nightly: parser accuracy tests, Elasticsearch re-index, S3 backup')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${REPO_URL}') }
                branch('*/main')
              }
            }
            scriptPath('jenkins/Jenkinsfile')
            lightweight(false)
          }
        }
      }
