# nginx for PlacementHub: serves the static UI and forwards /api/* to FastAPI.
# Runs as a non-root user, so it listens on 8080 (ports below 1024 need root).

server {
    listen 8080;
    server_name _;
    server_tokens off;                      # don't advertise the nginx version

    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Used by the Docker healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Prometheus metrics are for operators only - never expose them publicly.
    location = /api/metrics {
        return 404;
    }

    # /api/jobs/search -> http://api:8000/jobs/search (the trailing slash strips /api).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 3m;            # resume uploads
    }

    # Interactive API documentation (Swagger UI) and its OpenAPI schema.
    location /docs {
        proxy_pass http://api:8000/docs;
    }
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
